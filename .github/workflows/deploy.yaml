name: Salesforce Deployment Pipeline

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

    secrets:
      ENCRYPTION_KEY_FILE:
        required: true
      JWT_KEY_FILE:
        required: true
      DECRYPTION_KEY:
        required: true
      DECRYPTION_IV:
        required: true
      CONSUMER_KEY:
        required: true
      DEPLOYMENT_USER_USERNAME:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      SONAR_TOKEN:
        required: true

        



jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:

      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run common Salesforce setup which calls the Salesforce Common Setup action
      - name: Run Common Salesforce Setup
        uses: ./.github/actions/salesforce-common
        with:
          node_version: ${{ vars.NODE_VERSION }}
          java_version: ${{ vars.JAVA_VERSION }}
          python_version: ${{ vars.PYTHON_VERSION }}
          sf_cli_version: ${{ vars.SF_CLI_VERSION }}
          encryption_key_file: ${{ secrets.ENCRYPTION_KEY_FILE }}
          jwt_key_file: ${{ secrets.JWT_KEY_FILE }}
          decryption_key: ${{ secrets.DECRYPTION_KEY }}
          decryption_iv: ${{ secrets.DECRYPTION_IV }}
          consumer_key: ${{ secrets.CONSUMER_KEY }}
          deployment_username: ${{ secrets.DEPLOYMENT_USER_USERNAME }}
          org_alias: ${{ vars.ORG_DEFAULT_ALIAS }}
          instance_url: ${{ vars.HUB_LOGIN_URL }}
          delta_from: ${{ github.event.before }}
          delta_to: ${{ github.sha }}

      # Deploy Pre-Destructive Changes in Salesforce
      - name: "Deploy Pre-Destructive Changes in Salesforce ${{ inputs.envionment }}"
        # PR is Raised and it's in Open Status --> Validate the Changes
        if: ${{ github.event.pull_request.merged == true && github.event.action == 'closed' }}
        run: |
          if grep -q '<types>' estructiveChanges/destructiveChanges.xml ; then
            echo "---- Deploy Pre-Destructive Changes in Salesforce ----"
            sf project deploy start --target-org ${{ env.ORG_DEFAULT_ALIAS }} --pre-destructive-changes destructiveChanges/destructiveChanges.xml --manifest destructiveChanges/package.xml --wait 10
          else
            echo "---- No changes to deploy ----"
          fi

      # Deploy delta to Salesforce
      - name: Deploy Delta to Salesforce
        run: |
          sf project deploy start \
            --source-dir delta/force-app/main/default \
            --target-org "${{ vars.ORG_DEFAULT_ALIAS }}" \
            --ignore-conflicts \
            --wait 45

      # Deploy Post-Destructive Changes in Salesforce
      - name: "Deploy Post-Destructive Changes in Salesforce ${{ inputs.envionment }}"
        # PR is Raised and it's in Open Status --> Validate the Changes
        if: ${{ github.event.pull_request.merged == true && github.event.action == 'closed' }}
        run: |
          if grep -q '<types>' destructiveChanges/postDestructiveChanges.xml ; then
            echo "---- Deploy Post-Destructive Changes in Salesforce ----"
            sf project deploy start --target-org ${{ env.ORG_DEFAULT_ALIAS }} --post-destructive-changes destructiveChanges/postDestructiveChanges.xml --manifest destructiveChanges/package.xml --wait 45
          else
            echo "---- No changes to deploy ----"
          fi

      # Send Slack Notification on Success
      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          WORKFLOW: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_COLOR="good"
          else
            STATUS_EMOJI="❌"
            STATUS_COLOR="danger"
          fi

          PAYLOAD=$(jq -n \
            --arg emoji "$STATUS_EMOJI" \
            --arg workflow "$WORKFLOW" \
            --arg status "$STATUS" \
            --arg color "$STATUS_COLOR" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg event "$EVENT" \
            --arg run_url "$RUN_URL" \
            '{
              text: ($emoji + " *" + $workflow + "* — " + $status),
              attachments: [
                {
                  color: $color,
                  fields: [
                    {
                      title: "Repository",
                      value: $repository,
                      short: true
                    },
                    {
                      title: "Branch",
                      value: $branch,
                      short: true
                    },
                    {
                      title: "Triggered by",
                      value: $actor,
                      short: true
                    },
                    {
                      title: "Event",
                      value: $event,
                      short: true
                    },
                    {
                      title: "Run URL",
                      value: $run_url,
                      short: false
                    }
                  ]
                }
              ]
            }')

          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD"