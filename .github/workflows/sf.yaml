name: Salesforce CI Pipeline

run-name: "Salesforce CI Pipeline Running"

on:
  push:

jobs:
  setup-salesforce:
    name: Setup Salesforce
    runs-on: ubuntu-latest

    steps:
      - name: GitHub Script
        uses: actions/github-script@v9.0.0
        with:
          fetch-depth: 0
          script: |
            console.log(github.context.payload.repository.clone_url);
            console.log(github.context.payload.repository.ssh_url);
            console.log(github.context.payload.repository.git_url);
            console.log(github.context.payload.repository.svn_url);
            console.log(github.context.payload.repository.html_url);
            console.log(github.context.payload.repository.owner);
            console.log(github.context.payload.repository.name);
            console.log(github.context.payload.repository.full_name);

      - name: Installing Salesforce CLI
        run: |
          npm install --global @salesforce-cli/cli@latest
      - name: Check Salesforce CLI Version
        run: |
          sf --version
      - name: Install Code Analyzer
        run: |
          sf plugins install code-analyzer